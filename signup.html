<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Create Account | WeatherScope</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f5f7ff;
      color: #111827;
    }

    .auth-card {
      width: min(420px, calc(100% - 40px));
      padding: 32px;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      background: white;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }

    .auth-card h1 {
      margin-top: 0;
    }

    .auth-card input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 14px;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
    }

    .auth-card button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #3567e9;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    #message {
      min-height: 24px;
      margin-top: 14px;
      font-size: 14px;
    }

    a {
      color: #3567e9;
    }
  </style>
</head>

<body>
  <main class="auth-card">
    <h1>Create account</h1>
    <p>Save your favorite cities across devices.</p>

    <form id="signupForm">
      <input
        id="name"
        type="text"
        placeholder="Name"
        autocomplete="name"
        required
      />

      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="email"
        required
      />

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="new-password"
        minlength="6"
        required
      />

      <button type="submit">Create Account</button>
    </form>

    <p id="message"></p>

    <p>
      Already have an account?
      <a href="login.html">Log in</a>
    </p>

    <p>
      <a href="index.html">Back to WeatherScope</a>
    </p>
  </main>

  <script type="module" src="./js/signup.js"></script>
</body>
</html>
